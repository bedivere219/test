name: Java CI/CD with Maven

on:
  push:
    branches: [ "master" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
    # 1. GitHub 저장소에서 코드 체크아웃
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. JDK 17 세팅
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # 3. Maven 빌드
    - name: Build with Maven
      run: mvn clean package -DskipTests

    # 4. 빌드된 JAR 파일을 GCP Debian VM으로 전송 (SCP)
    - name: Deliver JAR via SSH
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.GCP_HOST }}
        username: ${{ secrets.GCP_USERNAME }}
        key: ${{ secrets.GCP_SSH_KEY }}
        source: "target/*.jar"
        target: "~/app/"           
        strip_components: 1

    # 5. GCP Debian VM에서 기존 프로세스 종료 후 새 JAR 실행 (SSH)
    - name: Execute remote SSH commands
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.GCP_HOST }}
        username: ${{ secrets.GCP_USERNAME }}
        key: ${{ secrets.GCP_SSH_KEY }}
        script: |
          mkdir -p ~/app
          cd ~/app
          
          # 1. 현재 SSH 세션이나 쉘을 제외하고, 오직 순수 java -jar 실행 프로세스만 정밀 조회
          CURRENT_PID=$(pgrep -f 'java -jar' | grep -v "$$" || true)
          
          if [ -z "$CURRENT_PID" ]; then
            echo "현재 구동 중인 스프링 부트 애플리케이션이 없습니다."
          else
            echo "구동 중인 스프링 부트 프로세스 발견 (PIDs: $CURRENT_PID)"
            for pid in $CURRENT_PID; do
              echo "스프링 부트 프로세스 종료 시도 (PID: $pid)"
              # 강제 종료가 아닌 정상 종료(-15)를 시도하되, 세션 유지를 위해 에러 처리를 완전히 차단
              kill -15 $pid 2>/dev/null || true
            done
            sleep 3
          fi
          
          # 2. 실행할 새 JAR 파일 찾기 (오리지널 실행 파일만 지정)
          JAR_NAME=$(ls -tr *.jar 2>/dev/null | grep -v 'original' | grep -v 'plain' | tail -n 1 || true)
          
          if [ -z "$JAR_NAME" ]; then
            echo "❌ 에러: ~/app 디렉토리에 실행할 JAR 파일이 존재하지 않습니다!"
            exit 1
          fi
          
          echo "실행할 JAR 파일: $JAR_NAME"
          
          # 3. 백그라운드 구동 및 로그 저장
          # 대기 상태에서 세션이 붙잡히지 않도록 완전히 분리(stdout, stderr, stdin 모두 리다이렉트)
          nohup java -jar $JAR_NAME > nohup.out 2>&1 < /dev/null &
          
          # 4. 백그라운드 프로세스가 뜰 수 있도록 1초 대기 후 정상 종료 선언
          sleep 1
          echo "🚀 새 애플리케이션이 백그라운드에서 정상 구동 명령을 받았습니다."