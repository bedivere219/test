name: Java CI/CD with Maven

on:
  push:
    branches: [ "master" ] # 실제 사용 중이신 master 브랜치로 고정했습니다.

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    # Node.js 20 경고 메시지를 제거하는 설정입니다.
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
    # 1. GitHub 저장소에서 코드 체크아웃
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. JDK 17 세팅
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # 3. Maven 빌드
    - name: Build with Maven
      run: mvn clean package -DskipTests

    # 4. 빌드된 JAR 파일을 GCP Debian VM으로 전송 (SCP)
    - name: Deliver JAR via SSH
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.GCP_HOST }}
        username: ${{ secrets.GCP_USERNAME }}
        key: ${{ secrets.GCP_SSH_KEY }}
        source: "target/*.jar"
        target: "~/app"
        strip_components: 1

    # 5. GCP Debian VM에서 기존 프로세스 종료 후 새 JAR 실행 (SSH)
    - name: Execute remote SSH commands
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.GCP_HOST }}
        username: ${{ secrets.GCP_USERNAME }}
        key: ${{ secrets.GCP_SSH_KEY }}
        script: |
          mkdir -p ~/app
          cd ~/app
          
          # 1. 기존 실행 중인 스프興 부트 프로세스 확인 (가장 안전한 단순 문자열 검색)
          CURRENT_PID=$(pgrep -f .jar || true)
          
          if [ -z "$CURRENT_PID" ]; then
            echo "현재 구동 중인 애플리케이션이 없습니다."
          else
            echo "기존 프로세스 종료 (PID: $CURRENT_PID)"
            # kill -15 종료 시 깃허브가 에러로 오해하지 않도록 뒤에 || true를 붙여 방어합니다.
            kill -15 $CURRENT_PID || true
            sleep 5
          fi
          
          # 2. target 폴더 안에서 올라온 실행용 오리지널 JAR 파일 찾기
          JAR_NAME=$(ls -tr *.jar 2>/dev/null | grep -v 'original' | grep -v 'plain' | tail -n 1 || true)
          
          if [ -z "$JAR_NAME" ]; then
            echo "❌ 에러: ~/app 디렉토리에 실행할 JAR 파일이 존재하지 않습니다!"
            exit 1
          fi
          
          echo "실행할 JAR 파일: $JAR_NAME"
          
          # 3. 백그라운드 구동 및 로그 저장
          nohup java -jar $JAR_NAME > nohup.out 2>&1 &
          
          # 4. 백그라운드로 정상 양도되었음을 명시하여 깃허브 Actions를 깔끔하게 종료시킵니다.
          echo "🚀 새 애플리케이션이 백그라운드에서 정상 구동 명령을 받았습니다."